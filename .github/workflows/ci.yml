name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            gcc \
            cmake \
            ninja-build \
            python3-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            libffi-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libzbar0 \
            libzbar-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install croc
        run: |
          curl -fsSL \
            "https://github.com/schollz/croc/releases/download/v11.3.2/croc_v11.3.2_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin croc
          croc --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,qr]'

      - name: Lint with black
        run: black --check .

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: python -m mypy --ignore-missing-imports --no-error-summary src/gator/ || echo "mypy notes (GTK modules are expected)"

      - name: Test with pytest
        run: pytest tests/ -q --tb=short
