name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish as a GitHub Release
        required: true
        default: v1.6.2
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
